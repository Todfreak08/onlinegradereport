<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Grade Report</title>

<style>
body {
  font-family: Cambria;
  margin:0;
  background:#ECE1BC;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  background:#B6C7D6;
}

.title { text-align:center; flex:1; }
.title h1 { margin:0; font-size:22px; }
.title p { margin:5px 0 0; font-size:14px; }

.logo { width:60px; }

.dark { background:#121212; color:white; }
.dark table { background:black; }
.dark th { background:maroon; }

.table-container { overflow-x:auto; }

table {
  width:100%;
  border-collapse:collapse;
  background:white;
  font-size:12px;
}

th,td {
  border:1px solid #ccc;
  padding:4px;
  text-align:center;
}

th { background:#8B0000; color:white; }

input { width:40px; }

.controls { padding:10px; }

.search-bar { padding:10px; }
.search-bar input { width:100%; padding:5px; }

button { margin:2px; cursor:pointer; }

/* FOOTER */
.footer {
  text-align:center;
  padding:10px;
  background:#B6C7D6;
  font-size:14px;
  margin-top:auto;
}
.footer #dateTime {
  font-size:12px;
  font-weight:normal;
}

.footer strong {
  font-size:16px;
}

.dark .footer {
  background:#1e1e1e;
  color:white;
}
</style>
</head>

<body id="body">

<div class="header">
<img src="bsit.png" class="logo">
<div class="title">
<h1>STUDENT GRADE REPORT</h1>
<p>School of Information and Communication Technology</p>
<p>Passi City College</p>
</div>
<img src="slogo.png" class="logo">
</div>

<div class="search-bar">
<input id="searchInput" placeholder="Search student..." oninput="searchStudent()">
<button onclick="toggleDark()">🌙</button>
</div>

<div class="controls">
<input id="nameInput" placeholder="Student Name">
<button onclick="addStudent()">Add Student</button>
<button onclick="clearInputs()">Clear</button>
</div>

<div class="controls">
<button onclick="addColumn('quiz')">+ Quiz</button>
<button onclick="addColumn('lab')">+ Lab</button>
<button onclick="addColumn('assign')">+ Assignment</button>
<button onclick="addColumn('attend')">+ Attendance</button>
<button onclick="addColumn('exam')">+ Exam</button>
</div>

<div class="table-container">
<table>
<thead id="tableHead"></thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<!-- SIMPLE FOOTER ONLY -->
<footer class="footer">
  <p>©2026 Passi City College | School of Information and Communication Technology</p>
  <p id="dateTime"></p>
</footer>

<script>

let students = JSON.parse(localStorage.getItem("students")) || [];
let structure = JSON.parse(localStorage.getItem("structure")) || {
  quiz:2, lab:2, assign:1, attend:1, exam:1
};

function saveAll(){
  localStorage.setItem("students", JSON.stringify(students));
  localStorage.setItem("structure", JSON.stringify(structure));
}

function toggleDark(){
  document.getElementById("body").classList.toggle("dark");
}

function addColumn(type){
  structure[type]++;
  students.forEach(s=>{
    s[type].push({score:0, items:0});
  });
  saveAll();
  renderTable();
}

function deleteColumn(type, index){
  if(structure[type] <= 1){
    return alert("At least 1 column required");
  }

  if(confirm("Delete column?")){
    structure[type]--;
    students.forEach(s=>{
      s[type].splice(index,1);
    });
    saveAll();
    renderTable();
  }
}

function addStudent(){
  let name = document.getElementById("nameInput").value.trim();
  if(!name) return alert("Enter student name");

  students.push({
    name,
    quiz:Array.from({length:structure.quiz},()=>({score:0,items:0})),
    lab:Array.from({length:structure.lab},()=>({score:0,items:0})),
    assign:Array.from({length:structure.assign},()=>({score:0,items:0})),
    attend:Array.from({length:structure.attend},()=>({score:0,items:0})),
    exam:Array.from({length:structure.exam},()=>({score:0,items:0}))
  });

  saveAll();
  renderTable();
  document.getElementById("nameInput").value="";
}

function clearInputs(){
  document.getElementById("nameInput").value="";
}

function updateValue(i,type,index,field,value){
  students[i][type][index][field] = Number(value)||0;
  saveAll();
  renderTable();
}

function compute(arr){
  let total=0;
  arr.forEach(x=>{
    if(x.items>0){
      total+=(x.score/x.items)*100;
    }
  });
  return arr.length?total/arr.length:0;
}

function deleteStudent(i){
  if(confirm("Delete student?")){
    students.splice(i,1);
    saveAll();
    renderTable();
  }
}

function editStudent(i){
  let n=prompt("Name:",students[i].name);
  if(n!==null) students[i].name=n;
  saveAll();
  renderTable();
}

function searchStudent(){
  let key=document.getElementById("searchInput").value.toLowerCase();
  let filtered=students.filter(s=>s.name.toLowerCase().includes(key));
  renderTable(filtered);
}

function renderTable(data=students){

  let head="<tr><th>Name</th>";

  ["quiz","lab","assign","attend","exam"].forEach(type=>{
    for(let i=0;i<structure[type];i++){
      head+=`<th>${type[0].toUpperCase()}${i+1}
      <button onclick="deleteColumn('${type}',${i})">❌</button>
      </th>`;
    }
    head+=`<th>${type.toUpperCase()} AVG</th>`;
  });

  head+="<th>Final</th><th>Action</th></tr>";
  tableHead.innerHTML=head;

  let rows="";

  data.forEach((s,i)=>{

    let q=compute(s.quiz);
    let l=compute(s.lab);
    let a=compute(s.assign);
    let at=compute(s.attend);
    let ex=compute(s.exam);

    let final=(q*0.2+l*0.3+a*0.1+at*0.1+ex*0.3).toFixed(2);

    let row=`<tr><td>${s.name}</td>`;

    ["quiz","lab","assign","attend","exam"].forEach(type=>{
      s[type].forEach((v,idx)=>{
        row+=`
        <td>
        <input value="${v.score}" oninput="updateValue(${i},'${type}',${idx},'score',this.value)">
        /
        <input value="${v.items}" oninput="updateValue(${i},'${type}',${idx},'items',this.value)">
        </td>`;
      });
      row+=`<td>${compute(s[type]).toFixed(1)}</td>`;
    });

    row+=`<td>${final}</td>
    <td>
    <button onclick="editStudent(${i})">✏️</button>
    <button onclick="deleteStudent(${i})">🗑️</button>
    </td></tr>`;

    rows+=row;
  });

  tableBody.innerHTML=rows;
}
function updateDateTime(){
  document.getElementById("dateTime").textContent =
  new Date().toLocaleString();
}

setInterval(updateDateTime, 1000);
updateDateTime();
renderTable();

window.addStudent=addStudent;
window.clearInputs=clearInputs;
window.addColumn=addColumn;
window.deleteColumn=deleteColumn;
window.updateValue=updateValue;
window.editStudent=editStudent;
window.deleteStudent=deleteStudent;
window.searchStudent=searchStudent;
window.toggleDark=toggleDark;

</script>

</body>
</html><p class="college-name">PASSI CITY COLLEGE</p>

<div class="container">

    <!-- Hidden field for editing -->
    <input type="hidden" id="studentId">

    <!-- Input Fields -->
    <input type="text" id="name" placeholder="Student Name">
    <input type="number" id="ias302" placeholder="IAS 302">
    <input type="number" id="sa301" placeholder="SA 301">
    <input type="number" id="itelec3" placeholder="IT ELEC 3">
    <input type="number" id="itelec4" placeholder="IT ELEC 4">
    <input type="number" id="cap301" placeholder="Cap 301">

    <button onclick="saveStudent()">Save Student</button>

    <!-- Student Table -->
    <table>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>IAS 302</th>
                <th>SA 301</th>
                <th>IT ELEC 3</th>
                <th>IT ELEC 4</th>
                <th>Cap 301</th>
                <th>Average</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

</div>

<script>
let students = JSON.parse(localStorage.getItem("students")) || [];

function saveToStorage() {
    localStorage.setItem("students", JSON.stringify(students));
}

function calculateAverage(s1, s2, s3, s4, s5) {
    return ((s1 + s2 + s3 + s4 + s5) / 5).toFixed(2);
}

function saveStudent() {
    const idField = document.getElementById("studentId").value;
    const name = document.getElementById("name").value.trim();
    const s1 = parseFloat(document.getElementById("ias302").value);
    const s2 = parseFloat(document.getElementById("sa301").value);
    const s3 = parseFloat(document.getElementById("itelec3").value);
    const s4 = parseFloat(document.getElementById("itelec4").value);
    const s5 = parseFloat(document.getElementById("cap301").value);

    if (!name || isNaN(s1) || isNaN(s2) || isNaN(s3) || isNaN(s4) || isNaN(s5)) {
        alert("Please complete all fields.");
        return;
    }

    const average = calculateAverage(s1, s2, s3, s4, s5);

    if (idField) {
        const index = students.findIndex(s => s.id == idField);
        students[index] = { id: idField, name, s1, s2, s3, s4, s5, average };
    } else {
        const newStudent = {
            id: Date.now(),
            name,
            s1,
            s2,
            s3,
            s4,
            s5,
            average
        };
        students.push(newStudent);
    }

    saveToStorage();
    renderTable();
    clearFields();
}

function renderTable() {
    const tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";

    students.forEach(student => {
        tableBody.innerHTML += `
            <tr>
                <td>${student.name}</td>
                <td>${student.s1}</td>
                <td>${student.s2}</td>
                <td>${student.s3}</td>
                <td>${student.s4}</td>
                <td>${student.s5}</td>
                <td>${student.average}</td>
                <td>
                    <button onclick="editStudent(${student.id})">Edit</button>
                    <button onclick="deleteStudent(${student.id})">Delete</button>
                </td>
            </tr>
        `;
    });
}

function editStudent(id) {
    const student = students.find(s => s.id == id);
    document.getElementById("studentId").value = student.id;
    document.getElementById("name").value = student.name;
    document.getElementById("ias302").value = student.s1;
    document.getElementById("sa301").value = student.s2;
    document.getElementById("itelec3").value = student.s3;
    document.getElementById("itelec4").value = student.s4;
    document.getElementById("cap301").value = student.s5;
}

function deleteStudent(id) {
    if (confirm("Are you sure you want to delete this student?")) {
        students = students.filter(student => student.id != id);
        saveToStorage();
        renderTable();
    }
}

function clearFields() {
    document.getElementById("studentId").value = "";
    document.getElementById("name").value = "";
    document.getElementById("ias302").value = "";
    document.getElementById("sa301").value = "";
    document.getElementById("itelec3").value = "";
    document.getElementById("itelec4").value = "";
    document.getElementById("cap301").value = "";
}

// Initial render
renderTable();
</script>

</body>
</html>
