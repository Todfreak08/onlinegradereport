<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Grade Report</title>

<style>
body { font-family: Cambria; margin:0; background:#ECE1BC; }

.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px; background:#B6C7D6;
}
.logo { width:80px; }
.title { text-align:center; flex:1; }

.search-bar { padding:10px; }
.search-bar input { width:60%; padding:8px; }

button { padding:6px 10px; cursor:pointer; }

table { width:100%; border-collapse:collapse; background:white; }
th { background:#8B0000; color:white; padding:8px; }
td { padding:6px; text-align:center; border:1px solid #ccc; }

.modal {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
}
.modal-content {
  background:white;
  width:90%;
  max-width:700px;
  margin:50px auto;
  padding:20px;
  border-radius:10px;
}

.card {
  background:#f3f3f3;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
}

.score-row {
  display:flex;
  gap:5px;
  margin-bottom:5px;
}

.score-row input { width:60px; }
.percent { width:60px; }

.pass { color:green; font-weight:bold; }
.fail { color:red; font-weight:bold; }
</style>
</head>

<body>

<div class="header">
<img src="bsit.png" class="logo">
<div class="title">
<h2>STUDENT GRADE REPORT</h2>
<p>School of ICT - Passi City College</p>
</div>
<img src="slogo.png" class="logo">
</div>

<div class="search-bar">
<input id="searchInput" placeholder="Search student..." oninput="renderTable()">
<button onclick="openModal()">+ Add Student</button>
</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Year & Section</th>
<th>Quiz</th>
<th>Lab</th>
<th>Assignment</th>
<th>Attendance</th>
<th>Exam</th>
<th>Final</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-content">

<h3>Add Student</h3>

<input id="nameInput" placeholder="Full Name"><br><br>
<input id="sectionInput" placeholder="Year & Section (e.g. BSIT 2A)" 
oninput="this.value = formatSection(this.value)"><br><br>

<div class="card">
<h4>Quiz</h4>
<div id="quizBox"></div>
<button onclick="addRow('quiz')">+ Add Quiz</button>
<p>Avg: <span id="quizAvg">0</span></p>
</div>

<div class="card">
<h4>Lab</h4>
<div id="labBox"></div>
<button onclick="addRow('lab')">+ Add Lab</button>
<p>Avg: <span id="labAvg">0</span></p>
</div>

<div class="card">
<h4>Assignment</h4>
<div id="assignBox"></div>
<button onclick="addRow('assign')">+ Add Assignment</button>
<p>Avg: <span id="assignAvg">0</span></p>
</div>

<div class="card">
<h4>Attendance</h4>
<input id="attendInput" type="number">
</div>

<div class="card">
<h4>Exam</h4>
<input id="examInput" type="number">
</div>

<button onclick="saveStudent()">Save</button>
<button onclick="closeModal()">Cancel</button>

</div>
</div>

<script>

// LOAD STORAGE
let students = JSON.parse(localStorage.getItem("students") || "[]");

// FORMAT SECTION (AUTO BSIT 2A)
function formatSection(value){
  if(!value) return "";

  value = value.toUpperCase().replace(/\s+/g,"");

  let match = value.match(/^([A-Z]+)(\d)([A-Z])$/);

  if(match){
    return match[1] + " " + match[2] + match[3];
  }

  return value;
}

// MODAL
function openModal(){
  document.getElementById("modal").style.display="block";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}

// ADD ROW
function addRow(type){
  let box = document.getElementById(type+"Box");

  let div = document.createElement("div");
  div.className="score-row";

  div.innerHTML = `
    <input placeholder="Score" oninput="computeAvg('${type}')">
    <input placeholder="Items" oninput="computeAvg('${type}')">
    <span class="percent">0%</span>
  `;

  box.appendChild(div);
}

// COMPUTE AVG
function computeAvg(type){
  let rows = document.getElementById(type+"Box").children;
  let total=0;

  for(let r of rows){
    let s = Number(r.children[0].value);
    let i = Number(r.children[1].value);

    let percent = (i>0)? (s/i*100):0;
    r.children[2].innerText = percent.toFixed(1)+"%";

    total += percent;
  }

  let avg = rows.length? total/rows.length:0;
  document.getElementById(type+"Avg").innerText = avg.toFixed(2);
}

// SAVE STUDENT
function saveStudent(){

  const name = document.getElementById("nameInput").value.trim();
  const rawSection = document.getElementById("sectionInput").value;
  const section = formatSection(rawSection);

  if(!name){
    alert("Please enter student name");
    return;
  }

  let student = {
    name: name,
    section: section,
    quiz: Number(document.getElementById("quizAvg").innerText),
    lab: Number(document.getElementById("labAvg").innerText),
    assign: Number(document.getElementById("assignAvg").innerText),
    attend: Number(document.getElementById("attendInput").value) || 0,
    exam: Number(document.getElementById("examInput").value) || 0
  };

  students.push(student);
  localStorage.setItem("students", JSON.stringify(students));

  clearForm();
  closeModal();
  renderTable();
}

// CLEAR FORM
function clearForm(){
  document.getElementById("nameInput").value="";
  document.getElementById("sectionInput").value="";
  document.getElementById("attendInput").value="";
  document.getElementById("examInput").value="";

  document.getElementById("quizBox").innerHTML="";
  document.getElementById("labBox").innerHTML="";
  document.getElementById("assignBox").innerHTML="";

  document.getElementById("quizAvg").innerText="0";
  document.getElementById("labAvg").innerText="0";
  document.getElementById("assignAvg").innerText="0";
}

// RENDER TABLE
function renderTable(){

  let key = document.getElementById("searchInput").value.toLowerCase();
  let rows = "";

  students
  .filter(s =>
    s.name.toLowerCase().includes(key) ||
    (s.section && s.section.toLowerCase().includes(key))
  )
  .forEach((s,i)=>{

    let final = (
      s.quiz*0.2 +
      s.lab*0.3 +
      s.assign*0.1 +
      s.attend*0.1 +
      s.exam*0.3
    ).toFixed(2);

    let status = final>=75 ? "Passed":"Failed";

    rows+=`
    <tr>
      <td>${s.name}</td>
      <td>${s.section || "-"}</td>
      <td>${s.quiz}</td>
      <td>${s.lab}</td>
      <td>${s.assign}</td>
      <td>${s.attend}</td>
      <td>${s.exam}</td>
      <td>${final}</td>
      <td class="${status=='Passed'?'pass':'fail'}">${status}</td>
      <td><button onclick="deleteStudent(${i})">Delete</button></td>
    </tr>`;
  });

  document.getElementById("tableBody").innerHTML = rows;
}

// DELETE
function deleteStudent(i){
  students.splice(i,1);
  localStorage.setItem("students", JSON.stringify(students));
  renderTable();
}

// INIT
renderTable();

</script>

</body>
</html>
